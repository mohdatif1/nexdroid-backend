name: Generate Keystore

on:
  workflow_dispatch:
    inputs:
      alias:
        description: 'Key Alias'
        required: true
        default: 'release'
      storepass:
        description: 'Store Password (min 6 chars)'
        required: true
      keypass:
        description: 'Key Password (min 6 chars)'
        required: true
      cn:
        description: 'Your Name (CN)'
        required: true
        default: 'Your Name'
      org:
        description: 'Organization (O)'
        required: true
        default: 'My App'
      country:
        description: 'Country Code (C) e.g. IN'
        required: true
        default: 'IN'
      validity:
        description: 'Validity in days'
        required: true
        default: '10000'

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Generate JKS Keystore
        run: |
          keytool -genkey -v \
            -keystore release.keystore \
            -alias "${{ github.event.inputs.alias }}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity ${{ github.event.inputs.validity }} \
            -storetype JKS \
            -storepass "${{ github.event.inputs.storepass }}" \
            -keypass "${{ github.event.inputs.keypass }}" \
            -dname "CN=${{ github.event.inputs.cn }}, O=${{ github.event.inputs.org }}, L=Unknown, ST=Unknown, C=${{ github.event.inputs.country }}"

      - name: Verify Keystore
        run: |
          keytool -list -v \
            -keystore release.keystore \
            -storepass "${{ github.event.inputs.storepass }}" \
            -storetype JKS

      - name: Convert to Base64 (for GitHub Secret)
        run: |
          base64 -w 0 release.keystore > keystore_base64.txt
          echo ""
          echo "=== BASE64 VALUE (copy this to GitHub Secret KEYSTORE_BASE64) ==="
          cat keystore_base64.txt
          echo ""
          echo "=== SECRET NAMES TO ADD IN GITHUB ==="
          echo "KEYSTORE_BASE64  -> keystore_base64.txt ka content"
          echo "KEY_ALIAS        -> ${{ github.event.inputs.alias }}"
          echo "KEY_STORE_PASSWORD -> (jo tumne diya)"
          echo "KEY_PASSWORD       -> (jo tumne diya)"

      - name: Upload Keystore as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: |
            release.keystore
            keystore_base64.txt
          retention-days: 1
